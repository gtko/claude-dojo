<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scène My Hero Academia</title>
<style>
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: #05080d; }
  canvas { display: block; width: 1440px; height: 900px; }
</style>
</head>
<body>
<canvas id="scene" width="2880" height="1800"></canvas>
<script>
(function () {
  'use strict';
  // Scène procédurale : ciel d'orage, skyline en couches, éclairs verts, rayons jaunes.
  // Tout est dessiné en code (aucune image externe). Graine fixe : rendu reproductible.
  var W = 1440, H = 900, GROUND = 735;
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0); // 1440 x 900 CSS -> 2880 x 1800 px

  // Générateur pseudo-aléatoire mulberry32, graine fixe.
  var seed = 0x4d484131;
  function rand() {
    seed = (seed + 0x6d2b79f5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), seed | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rr(a, b) { return a + (b - a) * rand(); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(e0, e1, x) { var t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); }
  function mix(a, b, t) { return a + (b - a) * t; }
  function rgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, a) { var c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // Bruit de valeur et fBm, pour les nuages.
  var SALT = 0x2f6b1d;
  function hash(x, y) {
    var h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ SALT;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y) {
    var s = 0, amp = 0.5, f = 1, norm = 0;
    for (var i = 0; i < 5; i++) { s += amp * vnoise(x * f, y * f); norm += amp; f *= 2.03; amp *= 0.5; }
    return s / norm;
  }

  // Ciel : dégradé de nuit d'orage, bleu-gris.
  function sky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05080e');
    g.addColorStop(0.4, '#101b28');
    g.addColorStop(0.75, '#1e3040');
    g.addColorStop(1, '#131f2a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // Halo radial additif.
  function glow(cx, cy, r, color, alpha) {
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
    ctx.restore();
  }

  // Nuages d'orage : fBm à domaine déformé, calculé sur une petite toile puis agrandi (doux).
  function clouds() {
    var cw = 360, ch = 225, STEP = 4;
    var off = document.createElement('canvas');
    off.width = cw; off.height = ch;
    var octx = off.getContext('2d');
    var img = octx.createImageData(cw, ch), d = img.data;
    var dark = [6, 10, 18], light = [70, 90, 106];
    for (var y = 0; y < ch; y++) {
      for (var x = 0; x < cw; x++) {
        var nx = x * STEP * 0.009, ny = y * STEP * 0.009;
        var q = fbm(nx + 3.1, ny + 1.7);
        var n = fbm(nx * 1.4 + 2.6 * q + 0.8, ny * 1.4 + 2.6 * q + 5.2);
        var fade = 1 - smooth(0.45, 1, y / ch);
        var fx = 1 - 0.8 * smooth(820, 1440, x * STEP); // nuages plus discrets à droite
        var a = smooth(0.44, 0.76, n) * fade * fx * 0.85;
        var t = smooth(0.52, 0.85, n) * fx;
        var i = (y * cw + x) * 4;
        d[i] = mix(dark[0], light[0], t);
        d[i + 1] = mix(dark[1], light[1], t);
        d[i + 2] = mix(dark[2], light[2], t);
        d[i + 3] = a * 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 0, 0, W, H);
    ctx.restore();
  }

  // Skyline en couches : lointain (brumeux), milieu, premier plan (le plus sombre).
  var LAYERS = {
    far:  { base: 600, hMin: 120, hMax: 250, wMin: 34, wMax: 70, gap: 4,  top: '#2b3e54', bot: '#1b2b3e', litP: 0.09, litA: 0.35, rowH: 9,  colW: 7 },
    mid:  { base: 660, hMin: 95,  hMax: 220, wMin: 26, wMax: 58, gap: 6,  top: '#172739', bot: '#0d1726', litP: 0.16, litA: 0.55, rowH: 9,  colW: 7 },
    near: { base: 735, hMin: 70,  hMax: 200, wMin: 40, wMax: 92, gap: 14, top: '#0e1826', bot: '#070d15', litP: 0.2,  litA: 0.6,  rowH: 10, colW: 8 }
  };
  var WARM = '#ffd98a', COOL = '#a6f2ff';

  // Hauteur relative : haute au centre-gauche, basse à droite (le panneau système occupe la droite).
  function envelope(cx) {
    return 0.42 + 0.58 * Math.exp(-Math.pow((cx - 0.38) / 0.22, 2));
  }
  function makeLayer(cfg) {
    var list = [], x = -10;
    while (x < W + 10) {
      var w = rr(cfg.wMin, cfg.wMax);
      var h = rr(cfg.hMin, cfg.hMax) * envelope((x + w / 2) / W);
      list.push({ x: x, w: w, top: cfg.base - h });
      x += w + rr(0, cfg.gap);
    }
    return list;
  }
  function drawLayer(list, cfg) {
    var g = ctx.createLinearGradient(0, cfg.base - 320, 0, cfg.base);
    g.addColorStop(0, cfg.top);
    g.addColorStop(1, cfg.bot);
    ctx.fillStyle = g;
    // Bloc continu jusqu'au sol : pas de trous dans la silhouette.
    ctx.fillRect(0, cfg.base, W, GROUND - cfg.base + 2);
    list.forEach(function (b) { ctx.fillRect(b.x, b.top, b.w, cfg.base - b.top + 2); });
    list.forEach(function (b) {
      if (b.w < 6) return;
      for (var y = b.top + 10; y < cfg.base - 8; y += cfg.rowH) {
        for (var x = b.x + 4; x < b.x + b.w - 5; x += cfg.colW) {
          if (rand() > cfg.litP) continue;
          ctx.globalAlpha = cfg.litA * rr(0.55, 1);
          ctx.fillStyle = rand() < 0.72 ? WARM : COOL;
          ctx.fillRect(x, y, 2.2, 3.4);
        }
      }
    });
    ctx.globalAlpha = 1;
  }
  function overlaps(b, x1, x2) { return b.x < x2 && b.x + b.w > x1; }
  function topAt(lists, x) {
    var best = Infinity;
    lists.forEach(function (list) {
      list.forEach(function (b) { if (x >= b.x && x <= b.x + b.w && b.top < best) best = b.top; });
    });
    return best === Infinity ? 420 : best;
  }

  // Éclairs : déplacement médian (zigzag), branches récursives.
  function gen(x1, y1, x2, y2, disp, iters) {
    var pts = [[x1, y1], [x2, y2]], d = disp;
    for (var it = 0; it < iters; it++) {
      var np = [];
      for (var i = 0; i < pts.length - 1; i++) {
        var a = pts[i], b = pts[i + 1];
        var dx = b[0] - a[0], dy = b[1] - a[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var off = rr(-d, d);
        np.push(a, [(a[0] + b[0]) / 2 - dy / len * off, (a[1] + b[1]) / 2 + dx / len * off]);
      }
      np.push(pts[pts.length - 1]);
      pts = np;
      d *= 0.5;
    }
    return pts;
  }
  function pathLen(p) {
    var s = 0;
    for (var i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    return s;
  }
  function spawn(pts, out, depth, len) {
    for (var i = 1; i < pts.length - 1; i++) {
      if (rand() > 0.09) continue;
      var p = pts[i], q = pts[i + 1];
      var ang = Math.atan2(q[1] - p[1], q[0] - p[0]) + rr(0.45, 0.9) * (rand() < 0.5 ? -1 : 1);
      var L = len * rr(0.12, 0.28);
      var end = [p[0] + Math.cos(ang) * L, p[1] + Math.sin(ang) * L];
      var sub = gen(p[0], p[1], end[0], end[1], L * 0.22, 3);
      out.push({ pts: sub });
      if (depth > 0) spawn(sub, out, depth - 1, L * 0.7);
    }
  }
  function strokeLine(pts, w, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
    ctx.stroke();
    ctx.restore();
  }
  // Trois passes : halo large, cœur vert, filet presque blanc.
  var PASSES = [[12, '#3cf59a', 0.10], [4.5, '#3cf59a', 0.42], [1.4, '#e3fff2', 0.95]];
  function drawBolt(path, k, sc) {
    PASSES.forEach(function (p) { strokeLine(path, p[0] * sc, p[1], p[2] * k); });
  }
  function strike(path, branches, k) {
    branches.forEach(function (b) { drawBolt(b.pts, k * 0.7, 0.55); });
    drawBolt(path, k, 1);
  }

  // Rayons jaunes qui partent du point d'impact.
  function rays(cx, cy, n) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < n; i++) {
      var ang = -0.1 * Math.PI + (i + rr(0.2, 0.8)) * (1.2 * Math.PI / n);
      var L = rr(120, 250), sp = rr(0.006, 0.012);
      var ex = cx + Math.cos(ang) * L, ey = cy + Math.sin(ang) * L;
      var g = ctx.createLinearGradient(cx, cy, ex, ey);
      g.addColorStop(0, rgba('#ffd60a', rr(0.12, 0.2)));
      g.addColorStop(1, rgba('#ffd60a', 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang - sp) * L, cy + Math.sin(ang - sp) * L);
      ctx.lineTo(cx + Math.cos(ang + sp) * L, cy + Math.sin(ang + sp) * L);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Bloom : copie floutée de la scène, ajoutée par-dessus.
  function bloom(px) {
    var tmp = document.createElement('canvas');
    tmp.width = cv.width; tmp.height = cv.height;
    tmp.getContext('2d').drawImage(cv, 0, 0);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    ctx.filter = 'blur(' + px + 'px)';
    ctx.drawImage(tmp, 0, 0);
    ctx.restore();
  }

  // Vignettage, et assombrissement à droite et en bas (zones des panneaux).
  function shade() {
    var r = ctx.createRadialGradient(640, 420, 260, 640, 420, 1040);
    r.addColorStop(0, 'rgba(3,5,9,0)');
    r.addColorStop(1, 'rgba(3,5,9,0.78)');
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, W, H);
    var h = ctx.createLinearGradient(860, 0, W, 0);
    h.addColorStop(0, 'rgba(3,5,9,0)');
    h.addColorStop(1, 'rgba(3,5,9,0.7)');
    ctx.fillStyle = h;
    ctx.fillRect(0, 0, W, H);
    var v = ctx.createLinearGradient(0, 520, 0, H);
    v.addColorStop(0, 'rgba(3,5,9,0)');
    v.addColorStop(0.55, 'rgba(3,5,9,0.7)');
    v.addColorStop(1, 'rgba(3,5,9,0.9)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  // Grain fin, d'amplitude faible.
  function grain(amp) {
    var img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = (rand() - 0.5) * amp;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---- Composition ----
  // Toutes les couches sont générées d'abord (ordre du PRNG fixé), puis dessinées.
  var farList = makeLayer(LAYERS.far).filter(function (b) {
    return !overlaps(b, 440, 492) && !overlaps(b, 598, 670);
  });
  farList.push({ x: 452, w: 30, top: 300 }, { x: 604, w: 56, top: 262 },
               { x: 616, w: 32, top: 212 }, { x: 631, w: 2, top: 132 });
  var midList = makeLayer(LAYERS.mid);
  var nearList = makeLayer(LAYERS.near);

  var M = gen(700, -10, 632, 124, 30, 5);            // éclair principal, frappe l'antenne
  var mB = []; spawn(M, mB, 2, pathLen(M));
  var sx = 300, sTop = topAt([midList, nearList], sx) + 2;
  var S = gen(222, -10, sx, sTop, 40, 6);             // éclair secondaire, frappe un toit
  var sB = []; spawn(S, sB, 2, pathLen(S));
  var T = gen(30, 200, 560, 236, 46, 6);              // éclair diffus dans les nuages

  sky();
  glow(190, 600, 560, '#ff8c2b', 0.10);               // lueur crépusculaire à gauche
  glow(640, 520, 720, '#4d7d99', 0.08);
  clouds();
  glow(330, 230, 420, '#3cf59a', 0.05);               // lueur d'orage

  drawLayer(farList, LAYERS.far);
  ctx.fillStyle = rgba('#3cf59a', 0.3);               // reflet vert sur les bords de la tour
  ctx.fillRect(604, 262, 1, GROUND - 262);
  ctx.fillRect(659, 262, 1, GROUND - 262);
  var hz = ctx.createLinearGradient(0, 500, 0, 640);  // brume entre les couches
  hz.addColorStop(0, rgba('#78aabe', 0));
  hz.addColorStop(1, rgba('#78aabe', 0.12));
  ctx.fillStyle = hz;
  ctx.fillRect(0, 500, W, 140);
  drawLayer(midList, LAYERS.mid);
  drawBolt(T, 0.4, 0.8);
  drawLayer(nearList, LAYERS.near);

  var gg = ctx.createLinearGradient(0, GROUND, 0, H); // sol : bande sombre, sans détail
  gg.addColorStop(0, '#0a1119');
  gg.addColorStop(1, '#03060a');
  ctx.fillStyle = gg;
  ctx.fillRect(0, GROUND, W, H - GROUND);

  glow(632, 130, 16, '#ff4b4b', 0.8);                 // lampe rouge de l'antenne
  ctx.fillStyle = '#ff4b4b';
  ctx.fillRect(631, 129, 2, 2);

  glow(632, 124, 160, '#3cf59a', 0.22);               // impact vert
  glow(632, 124, 40, '#ffd60a', 0.3);
  strike(M, mB, 1);
  strike(S, sB, 0.8);
  rays(632, 124, 5);

  bloom(24);
  shade();
  grain(7);
  window.__ready = true;
})();
</script>
</body>
</html>
