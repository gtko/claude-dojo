name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    name: macOS checks and install smoke test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check shell scripts
        run: bash -n install.sh uninstall.sh

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Lint shell scripts
        run: shellcheck -S warning install.sh uninstall.sh

      - name: Syntax check Node.js runtime
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: Compile the wallpaper host
        run: swiftc -O mac/DojoWallpaper.swift -o /tmp/DojoWallpaper -framework Cocoa -framework WebKit

      - name: Install, reinstall and uninstall in a temporary HOME
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          echo "Temporary HOME: $HOME"

          CHECK="${RUNNER_TEMP:-/tmp}/check-install.js"
          cat > "$CHECK" <<'EOF'
          // Usage: node check-install.js <HOME>
          // Verifies the installed files, fails on duplicated claude-dojo hooks,
          // and prints the number of claude-dojo hook commands as DOJO_HOOKS=<n>.
          const fs = require('fs');
          const path = require('path');
          const home = process.argv[2];
          const settingsFile = path.join(home, '.claude', 'settings.json');
          const configFile = path.join(home, '.config', 'claude-dojo', 'config.json');
          for (const [name, file] of [['settings.json', settingsFile], ['config.json', configFile]]) {
            if (!fs.existsSync(file)) { console.error(`missing ${name}: ${file}`); process.exit(1); }
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`ok ${name}: ${file}`);
          }
          const settings = JSON.parse(fs.readFileSync(settingsFile, 'utf8'));
          let total = 0;
          for (const [event, groups] of Object.entries(settings.hooks || {})) {
            const commands = [];
            for (const group of Array.isArray(groups) ? groups : []) {
              for (const hook of group.hooks || []) {
                if (typeof hook.command === 'string' && hook.command.includes('claude-dojo')) commands.push(hook.command);
              }
            }
            if (new Set(commands).size !== commands.length) {
              console.error(`duplicated claude-dojo hook under ${event}`);
              process.exit(1);
            }
            total += commands.length;
          }
          if (total === 0) { console.error('no claude-dojo hook found in settings.json'); process.exit(1); }
          console.log(`DOJO_HOOKS=${total}`);
          EOF

          first="$(node "$CHECK" "$HOME" | tee /dev/stderr | sed -n 's/^DOJO_HOOKS=//p')"

          ./install.sh --yes --no-launchd

          second="$(node "$CHECK" "$HOME" | tee /dev/stderr | sed -n 's/^DOJO_HOOKS=//p')"

          if [ -z "$first" ] || [ "$first" != "$second" ]; then
            echo "Hook count changed on reinstall: '$first' -> '$second'" >&2
            exit 1
          fi
          echo "Reinstall kept $second claude-dojo hook(s), no duplicates."

          ./uninstall.sh --yes --no-launchd --purge

      - name: Scan for personal terms
        run: |
          pattern='gtko|grego|mus-inn|Minzac|CascadeProjects|dotworld|mediamodifier|hermes'
          # The repository URL is allowed: remove it before matching.
          hits="$(grep -rniaE "$pattern" --exclude-dir=.git --exclude=ci.yml . \
            | sed -E 's#gtko/claude-dojo##g' \
            | grep -iaE "$pattern" || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Personal terms found outside the repository URL." >&2
            exit 1
          fi
          echo "No personal terms found."
