name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build the macOS app and publish the DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build DojoWallpaper.app and ClaudeDojo DMG
        run: ./scripts/build-app.sh --version "${GITHUB_REF_NAME#v}"

      - name: Verify DMG
        run: hdiutil verify "dist/ClaudeDojo-${GITHUB_REF_NAME#v}.dmg"

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish DMG to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeDojo-${{ steps.version.outputs.value }}.dmg
          generate_release_notes: true
